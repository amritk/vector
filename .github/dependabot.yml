# Proposes updates to the actions and reusable workflows pinned by commit in
# .github/workflows, such as amritk/workflows' release workflow. The cooldown
# waits until a release is 5 days old before proposing it, so a bad or
# compromised release has time to be caught and pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 5
