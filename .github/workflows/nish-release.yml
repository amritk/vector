# The release workflow for a Nish program, written to be reused: a repository
# calls it with `uses:` and a few inputs, and on a `v*` tag it
#
#   1. builds the program natively on one runner per target,
#   2. smoke-tests each binary from its unpacked tarball and, with `npm`, from
#      an npm install of the packages the release will publish,
#   3. attaches the tarballs, the npm packages and SHA256SUMS to a GitHub
#      release, with signed build provenance for every file, and
#   4. with `npm`, publishes one `<name>-<asset>` package per platform and
#      then the repository's own package, whose `bin` is a launcher that runs
#      the matching platform's binary.
#
# With `publish: false` it stops after step 2, which is how a pull request
# exercises every target before a tag ever does.
#
# It lives in amritk/vector until it moves to its own repository. The move is
# two edits: `uses: ./.github/actions/setup-nish` becomes that repository's
# action at a pinned ref, and TOOLS points at a checkout of it.
#
# npm trusted publishing names the CALLER's workflow file, not this one: for
# vector that is `release.yml`, with the environment `npm-environment` names.
# A package that has never been published cannot trust a workflow yet, so the
# first release of each package needs the `npm-token` secret (or a manual
# first publish); after that, configure trusted publishing and drop the token.

name: nish release

on:
  workflow_call:
    inputs:
      bin:
        description: The command name, and the binary's file name.
        type: string
        required: true
      entry:
        description: The Nish entry point to link.
        type: string
        default: src/main.ts
      link-flags:
        description: Extra flags for `nish <entry> --link <bin>`, such as `--profile size`.
        type: string
        default: ""
      targets:
        description: JSON array of assets to build (x86_64-linux, aarch64-linux, aarch64-darwin, x86_64-darwin).
        type: string
        default: '["x86_64-linux", "aarch64-linux", "aarch64-darwin", "x86_64-darwin"]'
      include:
        description: Space-separated repository files copied beside `bin/` in every release; missing ones are skipped.
        type: string
        default: LICENSE README.md THIRD_PARTY_NOTICES.md
      stage:
        description: Shell run in the checkout after the build, with STAGE (the release directory), ASSET and VERSION set, to add files beside the binary.
        type: string
        default: ""
      smoke:
        description: Shell run in an empty directory against BIN (an installed binary), with REPO set to the checkout. `BIN --version` is always checked to print the version.
        type: string
        default: ""
      npm:
        description: Publish to npm under package.json's `name`.
        type: boolean
        default: false
      npm-environment:
        description: The GitHub environment the npm publish job runs in, which trusted publishing names.
        type: string
        default: npm
      publish:
        description: Release and publish. False builds and smoke-tests every target and stops.
        type: boolean
        default: true
      node-version:
        description: The Node used to pack and publish. npm trusted publishing needs the npm it bundles to be 11.5.1 or newer.
        type: string
        default: 26.13.1
    secrets:
      npm-token:
        description: An npm token, only for a package's first publish, before trusted publishing can be configured for it.
        required: false

permissions: {}

env:
  # Where this workflow's own scripts are, relative to the checkout.
  TOOLS: .github/nish-release

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      rows: ${{ steps.plan.outputs.rows }}
      version: ${{ steps.plan.outputs.version }}
      assets: ${{ steps.plan.outputs.assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Version, tag and matrix
        id: plan
        env:
          PUBLISH: ${{ inputs.publish }}
          TARGETS: ${{ inputs.targets }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::a release runs on the tag v$version (package.json's version); this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          rows="$(node "$TOOLS/release.mjs" rows "$TARGETS")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          echo "assets=$(printf '%s' "$rows" | jq -r '[.[].asset] | join(" ")')" >> "$GITHUB_OUTPUT"
          printf '%s' "$rows" | jq -r '.[] | "\(.asset) on \(.runner)"'

  build:
    name: build (${{ matrix.target.asset }})
    needs: plan
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.rows) }}
    env:
      ASSET: ${{ matrix.target.asset }}
      BIN: ${{ inputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - uses: ./.github/actions/setup-nish

      - name: The runner is the platform the asset names
        env:
          HOST: ${{ matrix.target.host }}
        run: |
          host="$(uname -s)-$(uname -m)"
          if [ "$host" != "$HOST" ]; then
            echo "::error::this runner is $host, but $ASSET is built on $HOST"
            exit 1
          fi

      - name: Build
        id: build
        env:
          ENTRY: ${{ inputs.entry }}
          LINK_FLAGS: ${{ inputs.link-flags }}
          INCLUDE: ${{ inputs.include }}
        run: |
          name="$BIN-$VERSION-$ASSET"
          stage="$RUNNER_TEMP/release/$name"
          scratch="$RUNNER_TEMP/link"
          mkdir -p "$stage/bin" "$scratch" "$RUNNER_TEMP/out"
          # --link leaves IR and per-module files beside its output, so link
          # in a scratch directory and stage only the binary.
          # shellcheck disable=SC2086 # LINK_FLAGS is a list of flags
          nish "$ENTRY" --link "$scratch/$BIN" $LINK_FLAGS
          cp "$scratch/$BIN" "$stage/bin/$BIN"
          for f in $INCLUDE; do
            if [ -e "$f" ]; then cp -R "$f" "$stage/"; fi
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Stage hook
        if: inputs.stage != ''
        env:
          STAGE: ${{ steps.build.outputs.stage }}
        run: ${{ inputs.stage }}

      - name: Tarball
        id: tarball
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          tarball="$RUNNER_TEMP/out/$NAME.tar.gz"
          tar -czf "$tarball" -C "$RUNNER_TEMP/release" "$NAME"
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/smoke"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/unpack"
          echo "bin=$RUNNER_TEMP/unpack/$NAME/bin/$BIN" >> "$GITHUB_OUTPUT"
          tar -tzvf "$tarball"

      - name: The unpacked binary prints its version
        env:
          UNPACKED: ${{ steps.tarball.outputs.bin }}
        run: |
          out="$("$UNPACKED" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::$BIN --version printed \"$out\", which does not name $VERSION"; exit 1 ;;
          esac

      - name: Smoke the unpacked binary
        if: inputs.smoke != ''
        working-directory: ${{ runner.temp }}/smoke
        env:
          BIN: ${{ steps.tarball.outputs.bin }}
          REPO: ${{ github.workspace }}
        run: ${{ inputs.smoke }}

      - name: npm packages
        id: npm
        if: inputs.npm
        env:
          STAGE: ${{ steps.build.outputs.stage }}
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          node "$TOOLS/release.mjs" platform "$STAGE" "$ASSET" "$VERSION"
          platform="$(npm pack "$STAGE" --pack-destination "$RUNNER_TEMP/out" --ignore-scripts --json | jq -r '.[0].filename')"
          # The main package is packed here only to install it below; the
          # release job packs the one it publishes.
          # shellcheck disable=SC2086 # ASSETS is a list
          main="$(node "$TOOLS/release.mjs" main "$RUNNER_TEMP/try" "$BIN" "$VERSION" $ASSETS)"
          project="$RUNNER_TEMP/npm-install"
          mkdir -p "$project"
          (cd "$project" && npm init -y > /dev/null && npm install --no-audit --no-fund "$RUNNER_TEMP/out/$platform" "$main")
          echo "platform=$RUNNER_TEMP/out/$platform" >> "$GITHUB_OUTPUT"
          echo "bin=$project/node_modules/.bin/$BIN" >> "$GITHUB_OUTPUT"
          out="$("$project/node_modules/.bin/$BIN" --version)"
          case "$out" in
            *"$VERSION"*) echo "$out" ;;
            *) echo "::error::the npm-installed $BIN --version printed \"$out\""; exit 1 ;;
          esac

      - name: Smoke the npm-installed command
        if: inputs.npm && inputs.smoke != ''
        working-directory: ${{ runner.temp }}/smoke
        env:
          BIN: ${{ steps.npm.outputs.bin }}
          REPO: ${{ github.workspace }}
        run: ${{ inputs.smoke }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target.asset }}
          path: |
            ${{ runner.temp }}/out/${{ steps.build.outputs.name }}.tar.gz
            ${{ steps.npm.outputs.platform }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: release
    if: inputs.publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      BIN: ${{ inputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # Outside the checkout, so packing the repository below can never pick
      # these up.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist-release

      - name: Every target's tarball is here
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          for asset in $ASSETS; do
            test -s "$RUNNER_TEMP/dist-release/$BIN-$VERSION-$asset.tar.gz" || { echo "::error::no tarball for $asset"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/dist-release"

      - name: The npm package
        if: inputs.npm
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          # shellcheck disable=SC2086 # ASSETS is a list
          node "$TOOLS/release.mjs" main "$RUNNER_TEMP/dist-release" "$BIN" "$VERSION" $ASSETS

      - name: SHA256SUMS
        id: sums
        working-directory: ${{ runner.temp }}/dist-release
        run: |
          shopt -s nullglob
          files=(*.tar.gz *.tgz)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          { echo "sums<<SHA256SUMS_END"; cat SHA256SUMS; echo "SHA256SUMS_END"; } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist-release/SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist-release/* \
            --title "$BIN $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  npm:
    name: publish to npm
    if: inputs.publish && inputs.npm
    needs: [plan, release]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.npm-environment }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: npm new enough for trusted publishing
        run: |
          v="$(npm --version)"
          echo "npm $v"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a * 1e6 + b * 1e3 + c < 11005001) { console.error(`::error::npm ${process.argv[1]} predates trusted publishing (11.5.1); raise node-version`); process.exit(1) }' "$v"

      - name: The packages the release attached, as attached
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.release.outputs.sums }}
        run: |
          mkdir -p npm
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir npm
          printf '%s\n' "$SUMS" | grep '\.tgz$' > npm/expected.sums
          (cd npm && sha256sum -c expected.sums)

      - name: Publish, platforms first
        env:
          NPM_TOKEN: ${{ secrets.npm-token }}
          NPM_ENVIRONMENT: ${{ inputs.npm-environment }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            # Only for a first publish: the reference is expanded by npm, so
            # the token is never written to disk.
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          main=""
          order=()
          for tgz in npm/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | jq -e '.os' > /dev/null; then
              order+=("$tgz")
            else
              main="$tgz"
            fi
          done
          test -n "$main" || { echo "::error::the release attached no main npm package"; exit 1; }
          order+=("$main")
          for tgz in "${order[@]}"; do
            name="$(tar -xzOf "$tgz" package/package.json | jq -r .name)"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already on the registry; skipping"
              continue
            fi
            if ! npm view "$name" name > /dev/null 2>&1 && [ -z "$NPM_TOKEN" ]; then
              echo "::error::$name has never been published, so it cannot trust this workflow yet. Pass the npm-token secret for its first release (or publish $(basename "$tgz") by hand), then configure trusted publishing for $GITHUB_REPOSITORY, workflow file $(basename "${GITHUB_WORKFLOW_REF%@*}"), environment $NPM_ENVIRONMENT."
              exit 1
            fi
            npm publish "$tgz" --access public --provenance
          done
