name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch native z3
        run: bun run fetch-z3

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test with coverage floor
        run: bun run coverage

      - name: Generated code is in sync with schemas
        run: |
          bun run generate:schemas
          git diff --exit-code src/generated/

      - name: Compiled binary builds and verifies
        run: |
          bun run build
          ./dist/vector --verify test/fixtures/currency-spec.json test/fixtures/currency.json --json > /dev/null
          ./dist/vector --licenses > licenses.txt && grep -q "Third-party notices" licenses.txt

      - name: Spec contracts are in sync with specs/*.xml
        run: |
          status=0
          for f in specs/*.xml; do
            name=$(basename "$f" .xml)
            bun src/cli.ts spec extract "$f" -o "contracts/$name.json" --check || status=1
          done
          exit "$status"

  spec-xml-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned spec tools
        run: |
          gem install kramdown-rfc -v 1.7.43 --no-document
          pip install xml2rfc==3.35.0

      - name: specs/*.xml match a rebuild of specs/*.md (offline)
        run: |
          status=0
          for f in specs/*.md; do
            bash scripts/build-spec.sh --check "$f" || status=1
          done
          exit "$status"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build-spec golden test (tools present, so it does not skip)
        run: bun test test/build-spec.test.ts
