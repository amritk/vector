name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every action is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow files found under .github/workflows"
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            rc=0
            hits=$(grep -nE '^[[:space:]-]*uses[:]' "$f") || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error file=$f::grep failed with exit $rc"
              exit 1
            fi
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              n=${hit%%:*}
              ref=$(printf '%s' "${hit#*:}" \
                | sed -E 's/[[:space:]]+#.*$//; s/^[[:space:]-]*uses[:][[:space:]]*//; s/[[:space:]]+$//' \
                | tr -d "\"'")
              if ! [[ $ref =~ @[0-9a-f]{40}$ ]]; then
                echo "::error file=$f,line=$n::\"$ref\" is not pinned to a 40-hex commit SHA (local ./ and docker:// refs are refused too)"
                bad=1
              fi
            done <<< "$hits"
          done
          exit "$bad"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the LLVM toolchain nish links with
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          mkdir -p "$HOME/.local/llvm-bin"
          for t in clang llc opt ld.lld; do ln -sf "/usr/bin/$t-18" "$HOME/.local/llvm-bin/$t"; done
          echo "$HOME/.local/llvm-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Every exported function is called in tests
        run: npm run tested-exports

      - name: The agent-facing docs fit their caps
        run: npm run doc-caps

      - name: The doc-caps check tests itself
        run: node --test scripts/doc-caps.test.mjs

      # A pull request is also checked against its base, and a push to main
      # against the commit main was at before it: a cap may be lowered or added,
      # never raised or dropped. A push that creates the branch has no before.
      - name: No doc cap was raised or dropped since the base
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          npm run doc-caps -- --base "$BASE_SHA"

      - name: Cache the pinned nish, the prover and z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nish
            .nish-prover
            .z3
          key: toolchain-${{ runner.os }}-${{ hashFiles('.nish-version', 'scripts/fetch-nish.sh', '.nish-prover-version', 'scripts/fetch-nish-prover.sh', 'scripts/fetch-z3.sh') }}

      - name: Fetch the pinned nish compiler
        run: bash scripts/fetch-nish.sh

      - name: Fetch the pinned nish prover
        run: bash scripts/fetch-nish-prover.sh

      - name: Fetch the pinned z3
        run: bash scripts/fetch-z3.sh

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          VECTOR_PROVER_REQUIRED: "1"

      - name: vector's tests of itself match their specs
        run: npm run dogfood

      - name: Smoke-run the binary
        run: ./dist/vector --version
