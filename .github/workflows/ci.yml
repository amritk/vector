name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every action is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow files found under .github/workflows"
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            rc=0
            hits=$(grep -nE '^[[:space:]-]*uses[:]' "$f") || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error file=$f::grep failed with exit $rc"
              exit 1
            fi
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              n=${hit%%:*}
              ref=$(printf '%s' "${hit#*:}" \
                | sed -E 's/[[:space:]]+#.*$//; s/^[[:space:]-]*uses[:][[:space:]]*//; s/[[:space:]]+$//' \
                | tr -d "\"'")
              if ! [[ $ref =~ @[0-9a-f]{40}$ ]]; then
                echo "::error file=$f,line=$n::\"$ref\" is not pinned to a 40-hex commit SHA (local ./ and docker:// refs are refused too)"
                bad=1
              fi
            done <<< "$hits"
          done
          exit "$bad"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Every exported function is called in tests
        run: npm run tested-exports

      - name: The agent-facing docs fit their caps
        run: npm run doc-caps

      - name: The doc-caps check tests itself
        run: node --test scripts/doc-caps.test.mjs

      - name: Nothing relaxes the compiler's no-panic rule
        run: npm run allow-panics

      - name: The no-panic and allow-panics checks test themselves
        run: node --test scripts/allow-panics.test.mjs scripts/no-panic.test.mjs

      # A pull request is also checked against its base, and a push to main
      # against the commit main was at before it: a cap may be lowered or added,
      # never raised or dropped. A push that creates the branch has no before.
      - name: No doc cap was raised or dropped since the base
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          npm run doc-caps -- --base "$BASE_SHA"

      - name: Cache the pinned z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3
          key: z3-${{ runner.os }}-${{ hashFiles('scripts/fetch-z3.sh') }}

      - name: The pinned nish, and the LLVM toolchain it links with
        id: nish
        uses: amritk/workflows/actions/setup-nish@d0672b6994cc142bccf836ab1e185b9be990e832

      # The build, tests/run.mjs and the spec-run tests read the install at
      # .nish/ (bin/, libexec/, std/), where scripts/fetch-nish.sh puts it
      # locally, so .nish names the one setup-nish installed.
      - name: Link .nish to the installed nish
        env:
          NISH_BIN: ${{ steps.nish.outputs.nish }}
        run: |
          ln -sfn "$(dirname "$(dirname "$NISH_BIN")")" .nish
          .nish/bin/nish --version

      - name: Fetch the pinned z3
        run: bash scripts/fetch-z3.sh

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: vector's tests of itself match their specs
        run: npm run dogfood

      - name: Smoke-run the binary
        run: ./dist/vector --version

  # vector and every test it emits, built by the latest nish release (not the
  # pin) with no relax flag: a site that may panic is refused, and the job
  # lists each one. It runs beside `check`, which builds with the pin.
  no-panic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the pinned z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3
          key: z3-${{ runner.os }}-${{ hashFiles('scripts/fetch-z3.sh') }}

      - name: The pinned nish, and the LLVM toolchain it links with
        id: nish
        uses: amritk/workflows/actions/setup-nish@d0672b6994cc142bccf836ab1e185b9be990e832

      - name: Link .nish to the installed nish
        env:
          NISH_BIN: ${{ steps.nish.outputs.nish }}
        run: |
          ln -sfn "$(dirname "$(dirname "$NISH_BIN")")" .nish
          .nish/bin/nish --version

      - name: Fetch the pinned z3
        run: bash scripts/fetch-z3.sh

      - name: Build with the pinned nish
        run: npm run build

      # The highest release tag vX.Y.Z of amritk/nish; a prerelease or another
      # tag (ddc-*) is not a release of the compiler.
      - name: Resolve the latest nish release
        id: latest
        run: |
          version=$(git ls-remote --tags --refs https://github.com/amritk/nish.git 'v*' \
            | sed -E 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1) || version=""
          if [ -z "$version" ]; then
            echo "::error::no vX.Y.Z tag found on amritk/nish"
            exit 1
          fi
          echo "latest nish: $version (pinned: $(tr -d '[:space:]' < .nish-version))"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch the latest nish compiler
        env:
          NISH_VERSION: ${{ steps.latest.outputs.version }}
          NISH_DIR: ${{ runner.temp }}/nish-latest
        run: bash scripts/fetch-nish.sh

      - name: vector and its emitted tests build with no panic site
        env:
          NISH_BIN: ${{ runner.temp }}/nish-latest/bin/nish
        run: npm run no-panic

  # The one check to require: green only when every job above succeeded. A
  # job added to this workflow joins `needs` below.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [check, no-panic]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: amritk/workflows/actions/ci-gate@ac64e0798cf86da4bcdec948b09335334e5eae3c # main, with amritk/workflows#6
        with:
          needs: ${{ toJSON(needs) }}
