name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every action is pinned to a commit SHA
        run: |
          bad=$(grep -nE '^[[:space:]-]*uses[:]' .github/workflows/*.yml \
            | sed -E 's/[[:space:]]+#.*$//' \
            | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS=: read -r f l rest; do
              echo "::error file=$f,line=$l::not pinned to a 40-hex commit SHA:$rest"
            done
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the LLVM toolchain nish links with
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          mkdir -p "$HOME/.local/llvm-bin"
          for t in clang llc opt ld.lld; do ln -sf "/usr/bin/$t-18" "$HOME/.local/llvm-bin/$t"; done
          echo "$HOME/.local/llvm-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Every exported function is called in tests
        run: npm run tested-exports

      - name: Cache the pinned nish and z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nish
            .z3
          key: toolchain-${{ runner.os }}-${{ hashFiles('.nish-version', 'scripts/fetch-nish.sh', 'scripts/fetch-z3.sh') }}

      - name: Fetch the pinned nish compiler
        run: bash scripts/fetch-nish.sh

      - name: Fetch the pinned z3
        run: bash scripts/fetch-z3.sh

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: vector's tests of itself match their specs
        run: npm run dogfood

      - name: Smoke-run the binary
        run: ./dist/vector --version
