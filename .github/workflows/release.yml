# Releases vector with amritk/workflows' release workflow, in library mode: on
# a `v*` tag matching package.json's version, pack @amritk/vector (its Nish
# source, `src/`, as `npm publish` would pack it), attach the package and
# SHA256SUMS to a GitHub release, and publish it to npm. Nothing is built: a
# Nish library ships as source.
#
# A version with a hyphen (`1.2.0-rc.1`) is a prerelease: the GitHub release is
# marked as one and npm publishes it under the `next` dist-tag. Attestations
# and npm provenance exist only while the repository is public.
#
# A pull request that changes the release, and a manual run, pack the package
# without releasing anything.
#
# npm trusted publishing is configured against THIS file, `release.yml`, with
# the environment `npm`, which also holds NPM_TOKEN for the first publish only
# (amritk/workflows' README, "npm").

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: amritk/workflows/.github/workflows/release.yml@a864811ba5419acd1f619febf16fad9564986e23
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      mode: library
