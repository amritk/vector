# Releases vector with amritk/workflows' release workflow: on a `v*` tag
# matching package.json's version, build the native binary for every target
# with z3 bundled beside it, attach the tarballs to a GitHub release, and
# publish @amritk/vector to npm.
#
# A pull request that changes the release, and a manual run, build and
# smoke-test every target without releasing anything.
#
# npm trusted publishing is configured against THIS file, `release.yml`, with
# the environment `npm`. The first publish of each package needs the
# NPM_TOKEN secret (amritk/workflows' README, "npm").

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .nish-version
      - scripts/fetch-z3.sh
      - scripts/release-*.sh
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: amritk/workflows/.github/workflows/release.yml@2fbbf857f0a1d2792087b3a4c08f574c76f656e2
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      bin: vector
      summary: Prove small programs correct, and hold implementations to their specs
      stage: bash scripts/release-stage.sh
      smoke: bash "$REPO/scripts/release-smoke.sh"
      npm: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
