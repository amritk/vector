name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Cache the pinned nish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nish
          key: nish-${{ runner.os }}-${{ hashFiles('scripts/fetch-nish.sh') }}

      - name: Fetch the pinned nish, whose std TypeDoc reads
        run: bash scripts/fetch-nish.sh

      - name: Install dependencies
        run: npm ci

      - name: The generated reference is up to date
        if: github.event_name != 'pull_request'
        run: node scripts/gen-reference.mjs --check

      # A pull request is also checked against its base: the undocumented
      # baseline may lose lines, never gain one.
      - name: Fetch the pull request's base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: The generated reference is up to date, and the baseline has not grown
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gen-reference.mjs --check --base "$BASE_SHA"

      - name: Every link and anchor lands
        run: node scripts/check-links.mjs
