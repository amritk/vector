name: Spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-xml-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned spec tools
        run: |
          gem install kramdown-rfc -v 1.7.43 --no-document
          pip install xml2rfc==3.35.0

      - name: "specs/*.xml match a rebuild of specs/*.md (offline)"
        run: |
          status=0
          for f in specs/*.md; do
            bash scripts/build-spec.sh --check "$f" || status=1
          done
          exit "$status"

  spec-extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the LLVM toolchain nish links with
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          mkdir -p "$HOME/.local/llvm-bin"
          for t in clang llc opt ld.lld; do ln -sf "/usr/bin/$t-18" "$HOME/.local/llvm-bin/$t"; done
          echo "$HOME/.local/llvm-bin" >> "$GITHUB_PATH"

      - name: Cache the pinned nish and z3
        uses: actions/cache@v4
        with:
          path: |
            .nish
            .z3
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/fetch-nish.sh', 'scripts/fetch-z3.sh') }}

      - name: Fetch the pinned nish compiler
        run: bash scripts/fetch-nish.sh

      - name: Fetch the pinned z3
        run: bash scripts/fetch-z3.sh

      - name: Build
        run: npm run build

      - name: "contracts/*.json match an extract of specs/*.xml"
        run: |
          status=0
          for f in specs/*.xml; do
            ./dist/vector spec extract "$f" -o "contracts/$(basename "$f" .xml).json" --check || status=1
          done
          exit "$status"
