name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: The title is a conventional commit, `type(scope): imperative`
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9./-]*\))?!?: [^ ].*$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" is not a conventional commit: type(scope): imperative, e.g. \"fix(cli): exit 2 on a missing file\". Types: build chore ci docs feat fix perf refactor revert style test."
            exit 1
          fi
